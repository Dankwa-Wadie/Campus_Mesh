name: Build & Release Campus Mesh APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*' # Triggers for tags like v1.0.0

jobs:
  # Releases are what users actually install, and OTA hands them straight to the package
  # installer - so the unit suite gates the build rather than running only on branch pushes.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: app/build/reports/tests/

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Cache Gradle files
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Decode release keystore
        env:
          CM_KEYSTORE_BASE64: ${{ secrets.CM_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${CM_KEYSTORE_BASE64:-}" ]; then
            echo "::error::CM_KEYSTORE_BASE64 secret is not set. An unsigned APK cannot be installed by Android and breaks OTA signature verification."
            exit 1
          fi
          echo "$CM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campus-mesh.jks"

      - name: Build Release APKs (with architecture splits)
        env:
          CM_KEYSTORE_FILE: ${{ runner.temp }}/campus-mesh.jks
          CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
          CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
          CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APKs for GitHub Release
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          # Signed builds drop the "-unsigned" suffix, so accept either spelling but fail loudly
          # if an APK is missing entirely rather than silently publishing a partial release.
          for abi in arm64-v8a x86_64 universal; do
            case "$abi" in
              arm64-v8a) out=campus-mesh-arm64.apk ;;
              x86_64)    out=campus-mesh-x86_64.apk ;;
              universal) out=campus-mesh-universal.apk ;;
            esac
            if [ -f "app-$abi-release.apk" ]; then
              mv "app-$abi-release.apk" "$out"
            elif [ -f "app-$abi-release-unsigned.apk" ]; then
              echo "::error::app-$abi-release-unsigned.apk is unsigned - refusing to publish it."
              exit 1
            else
              echo "::error::No release APK produced for $abi"
              exit 1
            fi
          done

      - name: Verify APKs are signed
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          for apk in campus-mesh-*.apk; do
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" > /dev/null
            echo "✅ $apk is signed"
          done

      - name: Compute SHA-256 checksums
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          sha256sum campus-mesh-*.apk > checksums.txt
          cat checksums.txt

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: campus-mesh-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/campus-mesh-*.apk
            app/build/outputs/apk/release/checksums.txt
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: campus-mesh-release-${{ github.ref_name }}
          path: release

      # The in-app updater reads the SHA-256 from checksums.txt, falling back to a
      # "sha256: <hash>" line in the release body. Emit both so either path works.
      - name: Build checksum table for release notes
        id: checksums
        run: |
          set -euo pipefail
          {
            echo 'table<<CHECKSUM_EOF'
            while read -r hash name; do
              echo "sha256: $hash  \`$name\`"
            done < release/checksums.txt
            echo 'CHECKSUM_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/campus-mesh-arm64.apk
            release/campus-mesh-x86_64.apk
            release/campus-mesh-universal.apk
            release/checksums.txt
          name: "Campus Mesh ${{ github.ref_name }}"
          body: |
            ## Campus Mesh — GCTU Edition ${{ github.ref_name }}

            ### Installation
            - **Android (most phones)**: Download `campus-mesh-arm64.apk`
            - **Android (older/x86 devices)**: Download `campus-mesh-universal.apk`
            - **iPhone/Safari**: Scan the QR code in any peer's Campus Mesh app — no download needed!

            ### SHA-256 Checksums
            ${{ steps.checksums.outputs.table }}

            Also attached as `checksums.txt`.

            ### Offline Mesh OTA
            This version propagates automatically to nearby peers via Bluetooth LE epidemic broadcast — even without internet!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
