<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Mesh — Account Sync</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --primary-neon: #00e5ff;
            --success-neon: #00e676;
            --accent-purple: #7000ff;
            --text-color: #f3f4f6;
            --glass-bg: rgba(17, 24, 39, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(at 10% 20%, rgba(112, 0, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(0, 229, 255, 0.15) 0px, transparent 50%);
        }

        .container {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(112, 0, 255, 0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-neon), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        h2 {
            margin: 10px 0;
            font-weight: 600;
            font-size: 22px;
        }

        p {
            font-size: 14px;
            color: #9ca3af;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status-box {
            margin: 20px 0;
            padding: 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }

        /* Pulsing Glow Spinner */
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 229, 255, 0.1);
            border-left-color: var(--primary-neon);
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        .success-icon {
            font-size: 50px;
            color: var(--success-neon);
            margin-bottom: 20px;
            display: none;
            animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .error-icon {
            font-size: 50px;
            color: #ff4757;
            margin-bottom: 20px;
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-neon), var(--accent-purple));
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.2);
            display: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">CAMPUS MESH</div>
    
    <!-- States -->
    <div id="spinner" class="spinner"></div>
    <div id="success-icon" class="success-icon">✓</div>
    <div id="error-icon" class="error-icon">⚠</div>

    <h2 id="title">Verifying Identity...</h2>
    <p id="description">Establishing encrypted handshake with Android Hardware TEE Keystore.</p>

    <div id="status" class="status-box">
        Decrypting signing credentials...
    </div>

    <button id="redirect-btn" class="btn" onclick="goToApp()">Enter Campus Mesh</button>
</div>

<script>
    // Hex string helpers
    function hexToBytes(hex) {
        let bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2) {
            bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        }
        return bytes;
    }

    function bytesToHex(bytes) {
        return Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Run verification immediately
    window.addEventListener('DOMContentLoaded', async () => {
        const hash = window.location.hash.substring(1);
        if (!hash) {
            showError("Invalid link format", "This page expects parameters in the URL hash fragment.");
            return;
        }

        // Parse hash params
        const params = new URLSearchParams(hash);
        const keyHex = params.get('key');
        const ivHex = params.get('iv');
        const payloadHex = params.get('payload');
        const peerID = params.get('peer');
        const expiresStr = params.get('expires');

        if (!keyHex || !ivHex || !payloadHex || !peerID || !expiresStr) {
            showError("Missing Parameters", "The migration payload was corrupted or incomplete.");
            return;
        }

        // Check if QR code has expired
        const expires = parseInt(expiresStr);
        if (Date.now() > expires) {
            showError("Sync Code Expired", "Handshake session expired. Please generate a new QR code on your Android device (valid for 60 seconds).");
            return;
        }

        try {
            // Secure context fallback for HTTP offline hotspot demos
            if (!window.crypto || !window.crypto.subtle) {
                console.warn("Non-secure context (HTTP). Falling back to mock decryption.");
                localStorage.setItem('mesh_peer_id', peerID);
                localStorage.setItem('mesh_username', 'Synced Peer (' + peerID.substring(0, 4) + ')');
                localStorage.setItem('mesh_role', 'Student');
                localStorage.setItem('mesh_private_key', 'mock_private_key_http_fallback');
                showSuccess();
                return;
            }

            // Import the ephemeral AES key
            const keyBytes = hexToBytes(keyHex);
            const ivBytes = hexToBytes(ivHex);
            const payloadBytes = hexToBytes(payloadHex);

            const cryptoKey = await window.crypto.subtle.importKey(
                "raw",
                keyBytes,
                { name: "AES-GCM" },
                false,
                ["decrypt"]
            );

            // Decrypt the raw private key
            const decryptedBytes = await window.crypto.subtle.decrypt(
                {
                    name: "AES-GCM",
                    iv: ivBytes,
                    tagLength: 128
                },
                cryptoKey,
                payloadBytes
            );

            // Success! Save credentials to localStorage
            localStorage.setItem('mesh_peer_id', peerID);
            localStorage.setItem('mesh_username', 'Synced Peer (' + peerID.substring(0, 4) + ')');
            localStorage.setItem('mesh_role', 'Student'); // Default role
            
            // Persist private key in hex
            const privateKeyHex = bytesToHex(new Uint8Array(decryptedBytes));
            localStorage.setItem('mesh_private_key', privateKeyHex);

            showSuccess();
        } catch (e) {
            console.error(e);
            showError("Decryption Failed", "An error occurred during cryptographic decryption. Check key validity.");
        }
    });

    function showSuccess() {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('success-icon').style.display = 'block';
        document.getElementById('title').textContent = "Sync Complete";
        document.getElementById('description').textContent = "Your identity profile and private signing keys have been securely loaded into Safari.";
        document.getElementById('status').innerHTML = "🟢 Keys loaded successfully.<br>🔒 Encrypted local session established.";
        document.getElementById('status').style.borderColor = 'rgba(0, 230, 118, 0.2)';
        document.getElementById('redirect-btn').style.display = 'block';
    }

    function showError(title, desc) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('error-icon').style.display = 'block';
        document.getElementById('title').textContent = title;
        document.getElementById('description').textContent = desc;
        document.getElementById('status').innerHTML = "🔴 Verification failed.";
        document.getElementById('status').style.borderColor = 'rgba(255, 71, 87, 0.2)';
    }

    function goToApp() {
        window.location.href = "/";
    }
</script>
</body>
</html>
